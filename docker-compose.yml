version: "3.8"

volumes:
  db:
    driver: local
  user-files:
    driver: local
  config:
    driver: local
  esearch:
    driver: local
  onlyoffice:
    driver: local

services:
  db:
    image: mariadb:10.5
    #image: 1518459629/tcc:filerun_mariadb-10.5 
    container_name: filerun_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: filerunqwertyuiop
      MYSQL_USER: filerun
      MYSQL_PASSWORD: filerun
      MYSQL_DATABASE: filerun
    volumes:
      - db:/var/lib/mysql

  web:
    image: filerun
    #image: 1518459629/tcc:filerun_filerun  
    container_name: filerun_web
    restart: always
    environment:
      FR_DB_HOST: db
      FR_DB_PORT: 3306
      FR_DB_NAME: filerun
      FR_DB_USER: filerun
      FR_DB_PASS: filerun
      APACHE_RUN_USER: www-data
      APACHE_RUN_USER_ID: 33
      APACHE_RUN_GROUP: www-data
      APACHE_RUN_GROUP_ID: 33
    depends_on:
      - db
    ports:
      - 2026:80
    volumes:
      #- user-files:/user-files
      # chmod 777 -R /opt/filerun  ###必须对宿主机目录进行授权
      #本地目录挂载点
      - /opt/filerun:/data
      - config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3


##########################################################
# 附加服务onlyoffice
  onlyoffice:
    image: 1518459629/tcc:onlyoffice-9.3.0
    #image: 1518459629/tcc:filerun_onlyoffice-9.3.0  
    container_name: filerun_onlyoffice
    restart: always
    ports:
      - "2025:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=filerun@2026
##########################################################

  tika:
    image: apache/tika
    #image: 1518459629/tcc:filerun_apache-tika
    container_name: filerun_tika
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    #image: 1518459629/tcc:filerun_elasticsearch-6.8 
    container_name: filerun_search
    restart: always
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 1g
    command: >
      sh -c "mkdir -p /usr/share/elasticsearch/data/nodes &&
             chown -R elasticsearch:elasticsearch /usr/share/elasticsearch/data &&
             /usr/local/bin/docker-entrypoint.sh"
    volumes:
      - esearch:/usr/share/elasticsearch/data

networks:
  default:
    driver: bridge
